<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Expansión</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first app. Público = banda negra de impacto + contenido crema. Privado = barra lateral negra + lienzo crema. Una sola identidad (marca Tiby), sin modo oscuro. */
:root{
  --ink:#020202; --cream:#FBF8F4; --lime:#C1FF72; --orange:#FF751F;
  --card:#FFFDFA; --soft:#F2EDE6; --soft2:#E9E2D8;
  --line:rgba(2,2,2,.10); --line2:rgba(2,2,2,.20);
  --muted:#635C54; --on-dark-muted:rgba(251,248,244,.66); --dark-line:rgba(251,248,244,.16); --dark-card:#141412;
  --orange-soft:#FFE8DA; --orange-ink:#A3400A; --lime-soft:#EDFFD6; --lime-ink:#2E5000;
  --amber-soft:#FFF2C6; --amber-ink:#6A4B00; --peach:#FFD2B5;
  --f-display:'Poppins', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-body:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:16px; --r-sm:10px;
  color-scheme:light;
}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
html,body{background:var(--cream);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,6vw,46px);font-weight:600}
h2{font-size:clamp(22px,3.6vw,30px);font-weight:600}
h3{font-size:18px;font-weight:600}
h4{font-size:15px;font-weight:600}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:680px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.stack-l{display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:640px){.grid4{grid-template-columns:repeat(2,1fr)}}
.grid2>*,.grid3>*,.grid4>*{min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:12px;padding:12px 18px;font-family:var(--f-display);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .12s ease,background .15s ease;min-height:46px;background:transparent}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-lime{background:var(--lime);color:var(--ink)}
.btn-lime:hover:not([disabled]){background:#B2F55E}
.btn-dark{background:var(--ink);color:var(--cream)}
.btn-dark:hover:not([disabled]){background:#2A2A27}
.btn-line{border-color:var(--line2);color:var(--ink);background:var(--card)}
.btn-line:hover:not([disabled]){border-color:var(--ink)}
.btn-line-light{border-color:rgba(251,248,244,.7);color:var(--cream)}
.btn-line-light:hover{background:rgba(251,248,244,.08)}
.btn-orange{background:var(--orange);color:var(--ink)}
.btn-sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:9px}
.btn-block{width:100%}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:500}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Cards / pills */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card-soft{background:var(--soft);border-radius:var(--r);padding:18px}
.card-dark{background:var(--ink);color:var(--cream);border-radius:var(--r);padding:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;font-family:var(--f-display);white-space:nowrap;line-height:1.6}
.st-sin{background:var(--soft2);color:#4A443D}
.st-bor{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.st-rev{background:var(--amber-soft);color:var(--amber-ink)}
.st-aju{background:var(--orange-soft);color:var(--orange-ink)}
.st-apr{background:var(--lime);color:var(--ink)}
.st-late{background:var(--orange);color:var(--ink)}
.st-lock{background:var(--soft2);color:#4A443D}
.st-ok{background:var(--lime-soft);color:var(--lime-ink)}
.st-dark{background:var(--ink);color:var(--cream)}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:600;letter-spacing:.02em;border:1px solid var(--line2);color:var(--muted)}
.chip-m{border-color:var(--ink);color:var(--ink)}
.notice{border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.notice .icon{margin-top:2px}
.n-orange{background:var(--orange-soft);color:var(--orange-ink)}
.n-lime{background:var(--lime-soft);color:var(--lime-ink)}
.n-soft{background:var(--soft);color:var(--ink)}
.n-amber{background:var(--amber-soft);color:var(--amber-ink)}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13.5px;font-weight:600;font-family:var(--f-display)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line2);background:var(--card);border-radius:11px;padding:11px 13px;font-size:15px;min-height:46px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(193,255,114,.6)}
input[readonly],textarea[readonly]{background:var(--soft);border-color:transparent}
.err{color:var(--orange-ink);font-size:13.5px;font-weight:500}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--ink)}

/* Brand */
.brand{display:flex;flex-direction:column;line-height:1;gap:5px;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;color:inherit;text-align:left}
.brand .b1{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:-.02em}
.brand .b2{font-family:var(--f-display);font-size:9.5px;letter-spacing:.32em;font-weight:500}
.brand.on-dark .b2{color:var(--lime)}

/* Demo bar */
.demobar{background:#2B2A27;color:var(--cream);font-size:12.5px}
.demobar .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-block:7px}
.demobar b{font-family:var(--f-display);letter-spacing:.1em;font-size:11px;color:var(--lime)}
.demobar button{background:transparent;border:1px solid rgba(251,248,244,.25);color:var(--cream);border-radius:999px;padding:3px 11px;cursor:pointer;font-size:12.5px}
.demobar button.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.demobar .sp{flex:1}

/* Public */
.pub-dark{background:var(--ink);color:var(--cream)}
.pubnav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;padding-block:28px 48px;align-items:end}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:28px}}
.hero h1{font-size:clamp(32px,6.4vw,58px);font-weight:600;line-height:1.06}
.hero h1 em{font-style:normal;color:var(--lime)}
.hero .lead{color:var(--on-dark-muted);font-size:17px;max-width:52ch}
.biocard{background:var(--dark-card);border:1px solid var(--dark-line);border-radius:20px;overflow:hidden;display:grid;grid-template-columns:150px 1fr}
.biocard .ph{background:linear-gradient(160deg,#2A2A26,#151513);display:flex;align-items:center;justify-content:center;min-height:200px}
.biocard .ph img{width:100%;height:100%;object-fit:cover}
.biocard .mono{font-family:var(--f-display);font-size:44px;font-weight:600;color:var(--lime);letter-spacing:-.04em}
.biocard .tx{padding:20px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.biocard .tx p{color:var(--on-dark-muted);font-size:14px}
@media (max-width:420px){.biocard{grid-template-columns:110px 1fr}}
.freeband{border-top:1px solid var(--dark-line)}
.freeband .wrap{display:flex;gap:12px;align-items:center;padding-block:16px;font-size:14px;color:var(--on-dark-muted)}
.freeband .dot{width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.section{padding-block:56px}
.code-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:900px){.code-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:480px){.code-grid{grid-template-columns:1fr}}
.code-card{border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.code-card .L{font-family:var(--f-display);font-size:44px;font-weight:700;line-height:1;letter-spacing:-.04em}
.benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:760px){.benefits{grid-template-columns:1fr}}
.benefit{display:flex;gap:14px;align-items:flex-start}
.benefit .ic{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--lime);display:flex;align-items:center;justify-content:center;flex:none}
.footer{border-top:1px solid var(--line);padding-block:28px;font-size:13px;color:var(--muted)}

.lightbar{display:flex;align-items:center;gap:12px;padding-block:16px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--ink)}
.progress{height:8px;border-radius:99px;background:var(--soft2);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .3s ease}
.progress.dark>span{background:var(--ink)}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font-size:15.5px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--ink)}
.opt .rd{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center}
.opt.sel{background:var(--lime);border-color:var(--lime)}
.opt.sel .rd{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.quizfoot{display:grid;grid-template-columns:auto 1fr;gap:12px}
.infolist{display:flex;flex-direction:column;gap:2px}
.infolist .it{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.infolist .it:last-child{border-bottom:0}
.infolist .ic{width:36px;height:36px;border-radius:10px;background:var(--lime-soft);color:var(--lime-ink);display:flex;align-items:center;justify-content:center;flex:none}

/* Results */
.res-top{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding-block:28px 24px}
.gauge{position:relative;width:150px;height:150px}
.gauge svg{width:150px;height:150px;transform:rotate(-90deg)}
.gauge .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .v b{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1}
.gauge .v span{font-size:12px;opacity:.7}
@media (max-width:520px){.res-top{grid-template-columns:1fr}.gauge{width:130px;height:130px}.gauge svg{width:130px;height:130px}}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-bottom:28px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative}
.tile .n{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1}
.tile .k{font-family:var(--f-display);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.tile .lv{font-size:12.5px;opacity:.8}
.tile .flag{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:700;font-family:var(--f-display);background:var(--ink);color:var(--cream);border-radius:99px;padding:2px 8px;letter-spacing:.04em}
.tile.dk .flag{background:var(--lime);color:var(--ink)}
.recs{counter-reset:r;display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.recs li{display:flex;gap:12px;align-items:flex-start}
.recs li::before{counter-increment:r;content:counter(r);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--cream);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:13px;font-weight:600;flex:none}

/* CODE bars */
.dimrow{display:grid;grid-template-columns:34px minmax(80px,120px) 1fr 44px;gap:12px;align-items:center}
.dimL{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--soft2);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--ink)}

/* Private shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:var(--cream);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;gap:12px;align-items:center;background:none;border:0;color:var(--on-dark-muted);text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;font-weight:500}
.side nav button:hover{color:var(--cream);background:rgba(251,248,244,.06)}
.side nav button.on{background:var(--lime);color:var(--ink)}
.side nav .cnt{margin-left:auto;background:var(--orange);color:var(--ink);font-size:11px;font-weight:700;border-radius:99px;padding:1px 7px}
.side .who{margin-top:auto;border-top:1px solid var(--dark-line);padding-top:14px;font-size:13px;color:var(--on-dark-muted);display:flex;flex-direction:column;gap:8px}
.side .who b{color:var(--cream);font-weight:600}
.main{min-width:0;padding-bottom:40px}
.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:18px;border-bottom:1px solid var(--line)}
.topbar select{width:auto;max-width:100%;min-height:40px;padding:8px 12px;font-size:14px;font-weight:500}
.mobhead{display:none}
.botnav{display:none}
.tabnav{display:none}
.page{padding-block:24px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mobhead{display:block;background:var(--ink);color:var(--cream)}
  .mobhead .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:14px;gap:12px}
  .botnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--ink);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .botnav button{background:none;border:0;color:var(--on-dark-muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:10.5px;cursor:pointer}
  .botnav button.on{color:var(--lime)}
  .main{padding-bottom:96px}
  .tabnav{display:block;background:var(--ink);border-top:1px solid var(--dark-line)}
  .tabnav .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:8px;scrollbar-width:none}
  .tabnav button{flex:none;background:none;border:1px solid var(--dark-line);color:var(--on-dark-muted);border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
  .tabnav button.on{background:var(--lime);border-color:var(--lime);color:var(--ink)}
}
.ph-title{display:flex;flex-direction:column;gap:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover .li-t{text-decoration:underline;text-underline-offset:3px}
.li-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.li-t{font-weight:600;font-size:14.5px}
.li-s{font-size:12.5px;color:var(--muted)}
.meter{display:flex;flex-direction:column;gap:10px}
.meter .big{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1}
.meter .big small{font-size:16px;font-weight:500;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}

/* Route */
.stage{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px}
.stage .num{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:22px;font-weight:700}
.stage .rail{display:flex;flex-direction:column;align-items:center;gap:6px}
.stage .rail::after{content:"";flex:1;width:2px;background:var(--line2);min-height:20px}
.stage:last-child .rail::after{display:none}
.stage.locked .num{background:var(--soft2)!important;color:#4A443D!important}
.actrow{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.actrow:hover{border-color:var(--ink)}
.actrow.dis{cursor:default;opacity:.62}
.actrow.dis:hover{border-color:var(--line)}

/* Activity */
.qblock{display:flex;flex-direction:column;gap:8px}
.comment{background:var(--orange-soft);color:var(--orange-ink);border-radius:10px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px}
.comment.ok{background:var(--lime-soft);color:var(--lime-ink)}
.savebar{position:sticky;bottom:0;background:var(--cream);border-top:1px solid var(--line);padding-block:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}
@media (max-width:900px){.savebar{bottom:60px}}
.savestate{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;margin-right:auto}
details.ver{border:1px solid var(--line);border-radius:12px;background:var(--card)}
details.ver summary{padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.ver summary::-webkit-details-marker{display:none}
details.ver .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.ans{background:var(--soft);border-radius:10px;padding:10px 12px;white-space:pre-wrap;font-size:14px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.scale button{border:1.5px solid var(--line2);background:var(--card);border-radius:11px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.scale button b{font-family:var(--f-display);font-size:18px}
.scale button span{font-size:10.5px;color:var(--muted)}
.scale button.sel{background:var(--lime);border-color:var(--lime)}
.scale button.sel span{color:var(--ink)}
.scale button:disabled{cursor:default}

/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}

/* Charts */
.cols{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:18px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.cols .stk{width:100%;max-width:46px;position:relative;display:flex;align-items:flex-end;flex:1}
.cols .s1{position:absolute;bottom:0;left:0;right:0;background:var(--soft2);border-radius:6px 6px 2px 2px}
.cols .s2{position:absolute;bottom:0;left:18%;right:18%;background:var(--ink);border-radius:5px 5px 2px 2px}
.cols .lab{font-size:11px;color:var(--muted);white-space:nowrap}
.cols .val{font-size:11px;font-weight:600}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.cmp{display:grid;grid-template-columns:minmax(90px,130px) 1fr 56px;gap:12px;align-items:center}
.cmp .bars{display:flex;flex-direction:column;gap:5px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--cream);padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:50;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .icon{color:var(--lime)}
@media (max-width:900px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.login{min-height:calc(100vh - 34px);display:grid;grid-template-columns:1fr 1fr}
.login .l{padding-block:40px;display:flex;flex-direction:column;justify-content:center}
.login .r{background:var(--cream);color:var(--ink);display:flex;align-items:center}
.login .r .box{width:100%;max-width:420px;margin:0 auto;padding-block:40px}
@media (max-width:860px){.login{grid-template-columns:1fr;min-height:0}.login .l{padding-block:24px 8px}}
.arc{position:absolute;pointer-events:none}

function analyze(sc){
 const vals=DIMS.map(d=>sc[d.k]);const max=Math.max(...vals),min=Math.min(...vals);
 return {strong:DIMS.filter(d=>sc[d.k]===max).map(d=>d.k),prio:DIMS.filter(d=>sc[d.k]===min).map(d=>d.k),overall:Math.round(vals.reduce((a,b)=>a+b,0)/4)};
}
function pubVersion(v){return S.pubVersions.find(x=>x.v===v)}
function privVersion(v){return S.privVersions.find(x=>x.v===v)}
function pubScores(att){
 const qs=pubVersion(att.v).questions,sc={};
 DIMS.forEach(d=>{const q=qs.filter(x=>x.dim===d.k);const sum=q.reduce((a,x)=>a+(att.answers[x.id]??0),0);sc[d.k]=Math.round(sum/(q.length*3)*100)});
 return sc;
}
function privScores(ans,v){
 const qs=(v&&privVersion(v)?privVersion(v).questions:PRIVATE_Q),sc={};
 DIMS.forEach(d=>{const q=qs.filter(x=>x.dim===d.k&&x.type==='scale');const avg=q.reduce((a,x)=>a+(+ans[x.id]||1),0)/q.length;sc[d.k]=Math.round((avg-1)/4*100)});
 return sc;
}
function pickRecs(sc){
 const res=analyze(sc);const asc=[...DIMS].sort((a,b)=>sc[a.k]-sc[b.k]).map(d=>d.k);const out=[];
 if(res.prio.length===1){out.push({k:res.prio[0],t:RECS[res.prio[0]][0]},{k:res.prio[0],t:RECS[res.prio[0]][1]},{k:asc[1],t:RECS[asc[1]][0]})}
 else{let i=0;while(out.length<3){const k=res.prio[i%res.prio.length];const idx=Math.floor(i/res.prio.length);out.push({k,t:RECS[k][idx]});i++}}
 return out;
}

 if(a.approvedVersion)return 'aprobado';

V.quiz=()=>{
 const att=S.attempts.find(a=>a.id===S.browser.current);
 if(!att||att.status==='completado'){return V.intro()}
 const qs=pubVersion(att.v).questions;const i=Math.min(att.idx||0,qs.length-1);const q=qs[i];const ans=att.answers[q.id];const last=i===qs.length-1;
 const missing=qs.filter(x=>att.answers[x.id]===undefined).length;
 return `${lightTop('intro')}
<div class="wrap narrow stack-l fade" style="padding-block:4px 40px">
 <div class="stack-s"><div class="progress"><span style="width:${((i+1)/qs.length)*100}%"></span></div><p class="small muted num" style="text-align:center">Pregunta ${i+1} de ${qs.length}</p></div>
 <div class="stack-s"><span class="eyebrow" style="color:var(--orange-ink)">${DIM[q.dim].name}</span><h2>${esc(q.text)}</h2></div>
 <div class="stack-s" role="radiogroup" aria-label="${esc(q.text)}">${q.opts.map((o,j)=>`<button class="opt ${ans===j?'sel':''}" role="radio" aria-checked="${ans===j}" data-act="answer" data-q="${q.id}" data-v="${j}"><span class="rd">${ans===j?I('check'):''}</span>${esc(o)}</button>`).join('')}</div>
 <div class="quizfoot"><button class="btn btn-line" data-act="qprev" ${i===0?'disabled':''}>Anterior</button>
 ${last?`<button class="btn btn-lime" data-act="finish" ${ans===undefined?'disabled':''}>Ver mis resultados ${I('arrow')}</button>`:`<button class="btn btn-lime" data-act="qnext" ${ans===undefined?'disabled':''}>Continuar ${I('arrow')}</button>`}</div>
 ${last&&missing>(ans===undefined?1:0)?`<p class="err">Te faltan ${missing} pregunta(s). Vuelve atrás para responderlas antes de ver tus resultados.</p>`:''}
 <p class="tiny muted" style="text-align:center">Tus respuestas se guardan en este navegador. Puedes salir y continuar durante 7 días.</p>
</div>`};

   <div class="ans" style="background:rgba(251,248,244,.08);color:var(--cream)">${esc(msg)}</div>

const PNAV=[['p-home','Inicio','home'],['p-route','Mi ruta','route'],['p-diagnostico','Diagnóstico','chart'],['p-portfolio','Portafolio','folder'],['p-programs','Mis programas','layers'],['p-profile','Mi perfil','user']];

  </div></div>`}).join('')}</div></div>`};

function activityAnswers(a){const s=dStatus(a);if(a.draft)return a.draft.answers;if(s==='aprobado')return a.versions.find(v=>v.n===a.approvedVersion).answers;if(a.versions.length)return a.versions[a.versions.length-1].answers;return a.fields.map(()=> '')}
V['p-activity']=()=>{const pt=curPart();const a=pt.assignments.find(x=>x.id===UI.params.aid);
 if(!a)return empty('No encontramos esta actividad','Puede pertenecer a otra mentoría. Vuelve a tu ruta.');

 const s=dStatus(a),ed=canEdit(pt,a),ans=activityAnswers(a);const last=a.versions[a.versions.length-1];const rv=last&&last.review;
 const showCm=rv&&(s==='ajustes'||s==='aprobado');
 return `<div class="stack-l">
 <button class="link small" data-go="p-route" style="align-self:flex-start">← Mi ruta</button>
 <div class="stack-s"><div class="row">${dimBadge(a.stage,30)}<span class="eyebrow">${DIM[a.stage].name}</span>${a.mandatory?'<span class="chip chip-m">Obligatoria</span>':'<span class="chip">Complementaria</span>'}</div><h1>${esc(a.name)}</h1>
 <div class="row small">${stPill(a)}${a.due?`<span class="muted">Entrega: ${fd(a.due)}</span>`:''}${!a.active?pill('Retirada de tu ruta','st-sin'):''}</div></div>
 <div class="card-soft stack-s"><p><b>Objetivo:</b> ${esc(a.purpose)}</p><p class="small"><b>Instrucciones:</b> ${esc(a.instructions)}</p></div>
 ${rv?`<div class="notice ${rv.decision==='aprobado'?'n-lime':'n-orange'}">${I(rv.decision==='aprobado'?'check':'msg')}<div class="stack-s"><b>${rv.decision==='aprobado'?'Aprobado por Tiby':'Tiby pidió ajustes'} · versión ${last.n} · ${fd(rv.date)}</b><span class="small">Evaluación general: «${esc(rv.general)}»</span>${s==='ajustes'&&ed?'<span class="small">Edita tus respuestas y envía una nueva versión. La anterior se conserva en el historial.</span>':''}${s==='ajustes'&&!ed&&!partActive(pt)?'<span class="small">La mentoría finalizó; para hacer ajustes, Tiby debe ampliar tu fecha.</span>':''}</div></div>`:''}
 ${s==='revision'?`<div class="notice n-amber">${I('clock')}<span class="small">Enviaste la versión ${last.n} el ${fd(last.sentAt)}. Tiby la está revisando; mientras tanto no se puede editar.</span></div>`:''}
 ${isLate(a)&&ed?`<div class="notice n-orange">${I('alert')}<span class="small">La fecha de entrega pasó, pero todavía puedes enviar tu trabajo.</span></div>`:''}
 <div class="stack-l">${a.fields.map((f,i)=>`<div class="qblock"><label class="flabel" for="f-${i}">${i+1}. ${esc(f)}</label>
  <textarea id="f-${i}" data-bind="act" data-aid="${a.id}" data-f="${i}" ${ed?'':'readonly'} placeholder="${ed?'Escribe tu respuesta…':''}">${esc(ans[i]||'')}</textarea>
  ${showCm&&rv.comments[i]?`<div class="comment ${s==='aprobado'?'ok':''}">${I('msg')}<span><b>Tiby (v${last.n}):</b> ${esc(rv.comments[i])}</span></div>`:''}</div>`).join('')}</div>
 ${ed?`<div class="savebar"><span class="savestate" id="savestate">${a.draft?I('check')+'Borrador guardado · '+fd(a.draft.savedAt)+' '+hm(a.draft.savedAt):'Se guarda automáticamente mientras escribes'}</span>
  <button class="btn btn-line" data-act="saveDraft" data-aid="${a.id}">Guardar borrador</button><button class="btn btn-lime" data-act="openSubmit" data-aid="${a.id}">Enviar a revisión ${I('arrow')}</button></div>
  ${UI.params.confirm?`<div class="card stack" style="border-color:var(--ink)"><b>¿Enviar la versión ${a.versions.length+1} a revisión?</b><p class="small muted">Mientras Tiby la revisa no podrás editarla.</p>${UI.err?`<p class="err">${esc(UI.err)}</p>`:''}<div class="row"><button class="btn btn-dark" data-act="submitAct" data-aid="${a.id}">Sí, enviar</button><button class="btn btn-line" data-act="cancelSubmit" data-aid="${a.id}">Seguir editando</button></div></div>`:''}`:''}
 ${a.versions.length?`<div class="stack-s"><h3>Historial de versiones</h3>${[...a.versions].reverse().map(v=>`<details class="ver"><summary><b>Versión ${v.n}</b><span class="small muted">Enviada ${fd(v.sentAt)}${v.review?' · revisada '+fd(v.review.date):''}</span>${v.review?(v.review.decision==='aprobado'?pill('Aprobada','st-apr'):pill('Ajustes pedidos','st-aju')):pill('En revisión','st-rev')}</summary>
  <div class="body">${a.fields.map((f,i)=>`<div class="stack-s"><span class="small" style="font-weight:600">${esc(f)}</span><div class="ans">${esc(v.answers[i]||'—')}</div>${v.review&&v.review.comments[i]?`<div class="comment ${v.review.decision==='aprobado'?'ok':''}">${I('msg')}<span>${esc(v.review.comments[i])}</span></div>`:''}</div>`).join('')}${v.review?`<p class="small"><b>Evaluación general:</b> ${esc(v.review.general)}</p>`:''}</div></details>`).join('')}</div>`:''}
 </div>`};

V['p-diagnostico']=()=>{const pt=curPart(),dg=pt.diag.initial;const sent=['enviado','validado','correccion'].includes(dg.status)&&dg.scores;
 const fl=finalLabel(pt);
 if(!sent)return `<div class="stack-l"><div class="ph-title"><h1>Mi diagnóstico privado</h1><p class="muted">Este diagnóstico ayuda a Tiby a definir tu ruta personalizada.</p></div>
  <div class="card-dark stack"><h3>${dg.status==='no_iniciado'?'Aún no has comenzado':'Tienes un diagnóstico en progreso'}</h3><p style="color:var(--on-dark-muted)">4 secciones, una por dimensión CODE. Se guarda automáticamente y puedes retomarlo después.</p><div>${partActive(pt)?`<button class="btn btn-lime" data-go="p-diag">${dg.status==='no_iniciado'?'Comenzar':'Continuar'} ${I('arrow')}</button>`:'<span class="small">No realizado durante la mentoría.</span>'}</div></div></div>`;
 const res=analyze(dg.scores);
 return `<div class="stack-l"><div class="ph-title"><h1>Resumen de mi diagnóstico</h1><p class="muted">Diagnóstico inicial · enviado el ${fd(dg.sentAt)} · cuestionario versión ${dg.version}</p></div>
 <div class="row">${pill(DIAG_ST[dg.status][0],DIAG_ST[dg.status][1])}${dg.validatedAt&&dg.status==='validado'?`<span class="small muted">Validado el ${fd(dg.validatedAt)}</span>`:''}</div>
 ${dg.status!=='validado'?`<div class="notice n-amber">${I('clock')}<span class="small">Este resumen es preliminar e informativo mientras Tiby revisa tu diagnóstico. Tus actividades comenzarán cuando apruebe tu ruta.</span></div>`:''}
 ${dg.status==='correccion'&&partActive(pt)?`<div class="notice n-orange">${I('edit')}<div class="stack-s"><b>Tiby autorizó corregir tu diagnóstico</b><span class="small">Tu envío original se conserva. Al reenviar, los resultados se recalculan y vuelven a revisión.</span><div><button class="btn btn-dark btn-sm" data-go="p-diag">Corregir respuestas</button></div></div></div>`:''}
 <div class="card">${dimBars(dg.scores)}</div>
 <div class="grid2"><div class="card stack-s"><span class="eyebrow muted">Fortalezas identificadas</span><h3>${names(res.strong)}</h3><p class="small muted">${res.strong.map(k=>STRONG_MSG[k]).join(' ')}</p></div>
 <div class="card stack-s" style="border-color:var(--orange)"><span class="eyebrow" style="color:var(--orange-ink)">Oportunidades de desarrollo</span><h3>${names(res.prio)}</h3><p class="small muted">${res.prio.map(k=>PRIO_MSG[k]).join(' ')}</p></div></div>
 ${dg.status==='validado'&&dg.obs?`<div class="card-soft stack-s"><span class="eyebrow">Indicaciones de Tiby</span><p>${esc(dg.obs)}</p></div>`:''}
 <div class="card stack"><div class="row between"><div class="stack-s"><h3>Diagnóstico final</h3><p class="small muted">Mide tu avance al cierre con las mismas preguntas y puntuación del inicial. Solo Tiby puede habilitarlo.</p></div>${pill(fl[0],fl[1])}</div>
  <div class="row">${pt.diag.final.enabled&&pt.diag.final.status!=='enviado'&&partActive(pt)?`<button class="btn btn-lime" data-go="p-diag" data-kind="final">${pt.diag.final.status==='en_progreso'?'Continuar':'Responder'} diagnóstico final</button>`:''}${pt.diag.final.status==='enviado'?`<button class="btn btn-dark" data-go="p-compare">Ver comparación inicial y final ${I('arrow')}</button>`:''}</div></div>
 </div>`};

V['p-diag']=()=>{const pt=curPart();const kind=UI.params.kind==='final'?'final':'initial';const dg=pt.diag[kind];
 const editable=partActive(pt)&&(kind==='initial'?['no_iniciado','en_progreso','correccion'].includes(dg.status):(dg.enabled&&dg.status!=='enviado'));
 if(!editable)return V['p-diagnostico']();
 const ver=privVersion(kind==='final'?pt.diag.initial.version:dg.version)||privVersion(S.privCurrent);
 const sec=Math.max(0,Math.min(3,+(UI.params.sec||0)));const d=DIMS[sec];const qs=ver.questions.filter(q=>q.dim===d.k);
 const pending=ver.questions.filter(q=>dg.answers[q.id]===undefined||String(dg.answers[q.id]).trim()==='');
 return `<div class="stack-l" style="max-width:720px">
 <div class="ph-title"><span class="eyebrow" style="color:var(--orange-ink)">${kind==='final'?'Diagnóstico final':'Diagnóstico privado inicial'}${dg.status==='correccion'?' · corrección':''}</span><h1>${kind==='final'?'¿Cómo está tu negocio hoy?':'Mi diagnóstico privado'}</h1><p class="muted">${kind==='final'?'Mismas preguntas y puntuación que tu diagnóstico inicial, para comparar tu avance.':'Este diagnóstico te ayudará a definir tu ruta personalizada.'}</p></div>
 <div class="stack-s"><div class="progress"><span style="width:${(sec+1)/4*100}%"></span></div><div class="row between small"><span class="muted num">Sección ${sec+1} de 4</span><span class="savestate" id="savestate">${I('check')}Se guarda automáticamente</span></div></div>
 <h2 style="color:var(--orange-ink)">${PRIV_SECTIONS[d.k]}</h2>
 ${qs.map(q=>`<div class="qblock"><span class="flabel">${esc(q.text)}</span>${q.type==='scale'?`<div class="scale" role="radiogroup" aria-label="${esc(q.text)}">${[1,2,3,4,5].map(n=>`<button class="${+dg.answers[q.id]===n?'sel':''}" role="radio" aria-checked="${+dg.answers[q.id]===n}" data-act="scale" data-kind="${kind}" data-q="${q.id}" data-v="${n}"><b>${n}</b><span>${SCALE_L[n-1]}</span></button>`).join('')}</div>`
  :`<textarea id="dq-${q.id}" data-bind="diag" data-kind="${kind}" data-q="${q.id}" maxlength="500" placeholder="${esc(q.ph||'')}">${esc(dg.answers[q.id]||'')}</textarea><span class="tiny muted" style="text-align:right" id="cnt-${q.id}">${String(dg.answers[q.id]||'').length}/500</span>`}</div>`).join('')}
 <div class="quizfoot"><button class="btn btn-line" data-go="p-diag" data-kind="${kind}" data-sec="${sec-1}" ${sec===0?'disabled':''}>${I('back')}Anterior</button>
 ${sec<3?`<button class="btn btn-lime" data-go="p-diag" data-kind="${kind}" data-sec="${sec+1}">Continuar ${I('arrow')}</button>`:`<button class="btn btn-lime" data-act="sendDiag" data-kind="${kind}">${dg.status==='correccion'?'Reenviar diagnóstico':'Enviar diagnóstico'} ${I('arrow')}</button>`}</div>
 ${sec===3&&UI.err?`<p class="err">${esc(UI.err)}</p>`:''}
 ${sec===3&&pending.length?`<p class="small muted">Pendientes: ${pending.length} pregunta(s) en ${[...new Set(pending.map(q=>DIM[q.dim].name))].join(', ')}. Todas son obligatorias.</p>`:''}
 </div>`};

V['p-compare']=()=>{const pt=curPart(),i=pt.diag.initial,f=pt.diag.final;

 <nav>${ANAV.map(([v,l,ic])=>`<button class="${cur===v?'on':''}" data-go="${v}">${I(ic)}${l}${cnt(v)}</button>`).join('')}</nav>
 <div class="who"><b>Tiby Hernández</b><span>Mentora y administradora</span><button class="btn btn-line-light btn-sm" data-act="logout">${I('out')}Cerrar sesión</button></div></aside>
 <div class="main"><div class="mobhead"><div class="wrap">${brand(true,'a-home')}<button class="btn btn-line-light btn-sm" data-act="logout" aria-label="Cerrar sesión">${I('out')}</button></div></div>
 <div class="tabnav"><div class="wrap">${ANAV.map(([v,l])=>`<button class="${cur===v?'on':''}" data-go="${v}">${l}</button>`).join('')}</div></div>
 <div class="wrap page fade">${content}</div></div></div>`}
const aHead=(t,s,right='')=>`<div class="row between" style="align-items:flex-end"><div class="ph-title"><h1>${t}</h1>${s?`<p class="muted">${s}</p>`:''}</div>${right}</div>`;
function personState(p){if(p.status==='suspendido')return ['Suspendido','st-aju'];if(p.status==='invitado')return ['Invitación pendiente','st-rev'];if(p.status==='eliminado')return ['Eliminado','st-sin'];return partsOf(p.id).some(partActive)?['Activo','st-ok']:['Finalizado','st-sin']}

V['a-home']=()=>{const ppl=S.participants.filter(p=>p.status!=='eliminado');const st=ppl.map(personState);
 const count=l=>st.filter(s=>s[0]===l).length;
 const dq=S.participations.filter(p=>p.diag.initial.status==='enviado');
 const rv=S.participations.flatMap(pt=>pt.assignments.filter(a=>dStatus(a)==='revision').map(a=>({pt,a})));
 const aj=S.participations.flatMap(pt=>pt.assignments.filter(a=>dStatus(a)==='ajustes'&&a.active).map(a=>({pt,a})));
 const actP=S.participations.filter(pt=>partActive(pt)&&person(pt.pid)?.status!=='eliminado');
 const done=S.attempts.filter(a=>a.status==='completado').length;
 return `<div class="stack-l">${aHead('Hola, Tiby','Esto es lo que necesita tu atención hoy.',`<div class="row">${S.publicActive?pill('Diagnóstico público activo','st-ok'):pill('Diagnóstico público en pausa','st-aju')}</div>`)}
 <div class="kpis"><div class="kpi"><b class="num">${count('Activo')}</b><span>Participantes activos</span></div><div class="kpi"><b class="num">${count('Finalizado')}</b><span>Finalizados</span></div><div class="kpi"><b class="num">${count('Suspendido')}</b><span>Suspendidos</span></div><div class="kpi"><b class="num">${count('Invitación pendiente')}</b><span>Invitaciones pendientes</span></div><div class="kpi"><b class="num">${S.programs.length} · ${S.cohorts.length}</b><span>Programas · cohortes</span></div></div>
 <div class="grid2">
  <div class="card stack-s"><div class="row between"><h3>Diagnósticos por validar</h3>${pill(dq.length,'st-rev')}</div>${dq.length?`<div class="list">${dq.map(pt=>`<button class="li" data-go="a-review-diag" data-id="${pt.id}"><span class="li-main"><span class="li-t">${esc(fullName(person(pt.pid)))}</span><span class="li-s">${esc(prog(pt.programId).name)} · enviado ${fd(pt.diag.initial.sentAt)}</span></span>${I('arrow')}</button>`).join('')}</div>`:'<p class="small muted">Nada pendiente.</p>'}</div>
  <div class="card stack-s"><div class="row between"><h3>Entregables en revisión</h3>${pill(rv.length,'st-rev')}</div>${rv.length?`<div class="list">${rv.map(({pt,a})=>`<button class="li" data-go="a-review" data-id="${pt.id}" data-aid="${a.id}">${dimBadge(a.stage,28)}<span class="li-main"><span class="li-t">${esc(a.name)}</span><span class="li-s">${esc(fullName(person(pt.pid)))} · v${a.versions.length} · ${fd(a.versions[a.versions.length-1].sentAt)}${person(pt.pid).status==='suspendido'?' · cuenta suspendida':''}</span></span>${I('arrow')}</button>`).join('')}</div>`:'<p class="small muted">Nada pendiente.</p>'}</div>
 </div>
 <div class="card stack-s"><div class="row between"><h3>Esperando ajustes del participante</h3>${pill(aj.length,'st-aju')}</div>${aj.length?`<div class="list">${aj.map(({pt,a})=>`<button class="li" data-go="a-track" data-id="${pt.id}"><span class="li-main"><span class="li-t">${esc(a.name)}</span><span class="li-s">${esc(fullName(person(pt.pid)))} · ${esc(prog(pt.programId).name)}${partActive(pt)?'':' · mentoría finalizada'}</span></span>${pill('Requiere ajustes','st-aju')}</button>`).join('')}</div>`:'<p class="small muted">Ninguno.</p>'}</div>
 <div class="card stack"><h3>Progreso de participantes activos</h3>${actP.length?`<div class="tbl-wrap" style="border:0"><table><thead><tr><th>Participante</th><th>Programa</th><th>Progreso oficial</th><th>Presentado</th><th></th></tr></thead><tbody>${actP.map(pt=>{const pr=progress(pt);return `<tr><td><b>${esc(fullName(person(pt.pid)))}</b></td><td class="small">${esc(prog(pt.programId).name)}</td><td style="min-width:160px">${pr.pct===null?'<span class="small muted">Pendiente de iniciar</span>':`<div class="row" style="gap:8px;flex-wrap:nowrap"><div class="progress dark" style="flex:1"><span style="width:${pr.pct}%"></span></div><span class="num small">${pr.pct}%</span></div>`}</td><td class="num small">${pr.presented}/${pr.total}</td><td><button class="btn btn-line btn-sm" data-go="a-track" data-id="${pt.id}">Seguimiento</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="small muted">No hay participaciones activas.</p>'}</div>
 <div class="grid3"><button class="card stack-s" style="text-align:left;cursor:pointer" data-go="a-stats">${I('chart')}<b>Estadísticas públicas</b><span class="small muted num">${done} diagnósticos completados</span></button><button class="card stack-s" style="text-align:left;cursor:pointer" data-go="a-library">${I('book')}<b>Biblioteca de actividades</b><span class="small muted">${S.library.filter(l=>l.active).length} activas</span></button><button class="card stack-s" style="text-align:left;cursor:pointer" data-go="a-site">${I('globe')}<b>Editar sitio público</b><span class="small muted">Textos, imagen y WhatsApp</span></button></div>
 </div>`};

V['a-people']=()=>{const ppl=S.participants.filter(p=>p.status!=='eliminado');const show=UI.params.new==='1';
 return `<div class="stack-l">${aHead('Participantes','Las cuentas solo se crean por invitación.',`<button class="btn btn-lime" data-go="a-people" data-new="${show?'0':'1'}">${I('plus')}Nuevo participante</button>`)}
 ${show?`<form class="card stack" data-form="newPerson"><h3>Crear participante e invitar</h3><div class="grid2">
  <div class="field"><label for="np-n">Nombres</label><input id="np-n" required></div><div class="field"><label for="np-a">Apellidos</label><input id="np-a" required></div>
  <div class="field"><label for="np-e">Correo</label><input id="np-e" type="email" required></div>
  <div class="field"><label for="np-p">Programa</label><select id="np-p">${S.programs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
  <div class="field"><label for="np-c">Cohorte</label><select id="np-c"><option value="">Individual (sin cohorte)</option>${S.cohorts.map(c=>`<option value="${c.id}">${esc(prog(c.programId).name)} · ${esc(c.name)}</option>`).join('')}</select></div>
  <div class="field"><label for="np-s">Inicio</label><input id="np-s" type="date" value="${todayISO()}"></div>
  <div class="field"><label for="np-d">Duración (días)</label><input id="np-d" type="number" min="1" value="90"></div></div>
  ${UI.err?`<p class="err">${esc(UI.err)}</p>`:''}<div class="row"><button class="btn btn-dark" type="submit">Crear y generar invitación</button><span class="small muted">En la versión final se enviará un correo de invitación seguro.</span></div></form>`:''}
 <div class="tbl-wrap"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Estado</th><th>Programas</th><th>Acciones</th></tr></thead><tbody>
 ${ppl.map(p=>{const s=personState(p),ps=partsOf(p.id);return `<tr><td><b>${esc(fullName(p))}</b><div class="tiny muted">${esc(p.profesion||'')}</div></td><td class="small">${esc(p.email)}</td><td>${pill(s[0],s[1])}</td><td class="small">${ps.map(x=>esc(prog(x.programId).name)+(partActive(x)?'':' (finalizado)')).join('<br>')}</td>
 <td><div class="row" style="gap:6px;flex-wrap:nowrap">${ps[0]?`<button class="btn btn-line btn-sm" data-go="a-track" data-id="${ps.filter(partActive)[0]?.id||ps[0].id}">Seguimiento</button>`:''}
 ${p.status==='invitado'?`<button class="btn btn-line btn-sm" data-go="invite" data-token="${p.inviteToken}" title="Simula el enlace que recibe la persona">Ver invitación</button>`:''}
 ${p.status==='activo'?`<button class="btn btn-line btn-sm" data-act="suspend" data-id="${p.id}">Suspender</button>`:''}${p.status==='suspendido'?`<button class="btn btn-dark btn-sm" data-act="reactivate" data-id="${p.id}">Reactivar</button>`:''}</div></td></tr>`}).join('')}
 </tbody></table></div><p class="tiny muted">Suspender quita el acceso al portal pero conserva perfil, diagnósticos, entregables e historial. Puedes seguir revisando sus trabajos pendientes.</p></div>`};

V['a-programs']=()=>`<div class="stack-l">${aHead('Programas y cohortes','Referencia: 90 días para mentorías grupales. Las fechas se pueden ajustar por participante.')}
 ${S.programs.map(p=>{const cs=S.cohorts.filter(c=>c.programId===p.id);const pts=S.participations.filter(x=>x.programId===p.id);return `<div class="card stack"><div class="row between"><div class="stack-s"><h3>${esc(p.name)}</h3><p class="small muted">${esc(p.desc)}</p></div>${pill(p.status==='activo'?'Activo':'Cerrado',p.status==='activo'?'st-ok':'st-sin')}</div>
 <p class="small">Fechas: <b>${fd(p.start)} – ${fd(p.end)}</b> · ${pts.length} participación(es)</p>
 ${cs.length?`<div class="tbl-wrap"><table><thead><tr><th>Cohorte</th><th>Fechas comunes</th><th>Participantes</th></tr></thead><tbody>${cs.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td class="small">${fd(c.start)} – ${fd(c.end)}</td><td class="small">${pts.filter(x=>x.cohortId===c.id).map(x=>`<button class="link" data-go="a-track" data-id="${x.id}">${esc(fullName(person(x.pid)))}</button>`).join(', ')||'—'}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Sin cohortes: participaciones individuales.</p>'}</div>`}).join('')}
 <div class="grid2"><form class="card stack" data-form="newProgram"><h3>Nuevo programa</h3><div class="field"><label for="pg-n">Nombre</label><input id="pg-n" required></div><div class="field"><label for="pg-d">Descripción</label><textarea id="pg-d" style="min-height:70px"></textarea></div><div class="grid2"><div class="field"><label for="pg-s">Inicio</label><input id="pg-s" type="date" value="${todayISO()}" required></div><div class="field"><label for="pg-e">Fin previsto</label><input id="pg-e" type="date" value="${addDays(todayISO(),90)}" required></div></div><div><button class="btn btn-dark" type="submit">Crear programa</button></div></form>
 <form class="card stack" data-form="newCohort"><h3>Nueva cohorte</h3><div class="field"><label for="ch-p">Programa</label><select id="ch-p">${S.programs.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label for="ch-n">Nombre del grupo</label><input id="ch-n" required placeholder="Ej.: Cohorte Febrero 2027"></div><div class="grid2"><div class="field"><label for="ch-s">Inicio</label><input id="ch-s" type="date" value="${todayISO()}" required></div><div class="field"><label for="ch-e">Fin</label><input id="ch-e" type="date" value="${addDays(todayISO(),90)}" required></div></div><div><button class="btn btn-dark" type="submit">Crear cohorte</button></div></form></div>
 <p class="tiny muted">Una cohorte organiza la mentoría; no comparte los trabajos privados entre sus integrantes.</p></div>`;

V['a-reviews']=()=>{const dq=S.participations.filter(p=>['enviado','correccion'].includes(p.diag.initial.status));const rv=S.participations.flatMap(pt=>pt.assignments.filter(a=>dStatus(a)==='revision').map(a=>({pt,a})));
 return `<div class="stack-l">${aHead('Revisiones','Diagnósticos privados y entregables enviados.')}
 <div class="stack-s"><h3>Diagnósticos privados</h3><div class="tbl-wrap"><table><thead><tr><th>Participante</th><th>Programa</th><th>Estado</th><th>Enviado</th><th></th></tr></thead><tbody>${S.participations.filter(p=>p.diag.initial.status!=='no_iniciado').map(pt=>{const d=pt.diag.initial;return `<tr><td><b>${esc(fullName(person(pt.pid)))}</b></td><td class="small">${esc(prog(pt.programId).name)}</td><td>${pill(DIAG_ST[d.status][0],DIAG_ST[d.status][1])}</td><td class="small">${fd(d.sentAt)}</td><td><button class="btn ${d.status==='enviado'?'btn-dark':'btn-line'} btn-sm" data-go="a-review-diag" data-id="${pt.id}">${d.status==='enviado'?'Revisar':'Ver'}</button></td></tr>`}).join('')}</tbody></table></div></div>
 <div class="stack-s"><h3>Entregables en revisión <span class="muted">(${rv.length})</span></h3>${rv.length?`<div class="tbl-wrap"><table><thead><tr><th>Actividad</th><th>Participante</th><th>Versión</th><th>Enviado</th><th></th></tr></thead><tbody>${rv.map(({pt,a})=>`<tr><td><div class="row" style="gap:8px;flex-wrap:nowrap">${dimBadge(a.stage,26)}<b>${esc(a.name)}</b></div></td><td class="small">${esc(fullName(person(pt.pid)))}${person(pt.pid).status==='suspendido'?' · '+pill('Suspendida','st-aju'):''}</td><td class="num small">v${a.versions.length}</td><td class="small">${fd(a.versions[a.versions.length-1].sentAt)}</td><td><button class="btn btn-dark btn-sm" data-go="a-review" data-id="${pt.id}" data-aid="${a.id}">Revisar</button></td></tr>`).join('')}</tbody></table></div>`:empty('No hay entregables esperando revisión')}</div></div>`};

V['a-review-diag']=()=>{const pt=part(UI.params.id);if(!pt)return empty('No encontrado');const d=pt.diag.initial,p=person(pt.pid);const ver=privVersion(d.version);
 const started=pt.routeApproved&&pt.assignments.some(a=>a.versions.length||a.draft);
 return `<div class="stack-l"><button class="link small" data-go="a-reviews" style="align-self:flex-start">← Revisiones</button>
 ${aHead('Diagnóstico de '+esc(fullName(p)),`${esc(prog(pt.programId).name)} · cuestionario v${d.version} · enviado ${fd(d.sentAt)}`,pill(DIAG_ST[d.status][0],DIAG_ST[d.status][1]))}
 ${d.corrections.length&&started?`<div class="notice n-amber">${I('alert')}<span class="small">Este diagnóstico se corrigió después de iniciar la mentoría. Todo el trabajo se conserva; revisa manualmente si la ruta necesita ajustes.</span></div>`:''}
 ${d.scores?`<div class="card">${dimBars(d.scores)}</div>`:''}
 <div class="card stack"><h3>Respuestas</h3>${DIMS.map(dm=>`<div class="stack-s"><span class="eyebrow" style="color:var(--orange-ink)">${PRIV_SECTIONS[dm.k]}</span>${ver.questions.filter(q=>q.dim===dm.k).map(q=>`<div class="row between small" style="align-items:flex-start;flex-wrap:nowrap;gap:16px"><span style="flex:1">${esc(q.text)}</span><b style="max-width:55%;text-align:right">${q.type==='scale'?(d.answers[q.id]?d.answers[q.id]+' · '+SCALE_L[d.answers[q.id]-1]:'—'):esc(d.answers[q.id]||'—')}</b></div>`).join('')}</div>`).join('<hr class="sep">')}</div>
 ${d.corrections.length?`<div class="card stack-s"><h3>Correcciones registradas</h3>${d.corrections.map((c,i)=>`<details class="ver"><summary><b>Corrección ${i+1}</b><span class="small muted">Autorizada ${fd(c.authorizedAt)}${c.resentAt?' · reenviada '+fd(c.resentAt):' · pendiente de reenvío'}</span></summary><div class="body small">${DIMS.map(dm=>`<span>${dm.name}: ${c.prevScores[dm.k]} → ${c.newScores?c.newScores[dm.k]:'…'}</span>`).join('')}<span class="muted">Respuestas originales conservadas (${Object.keys(c.prevAnswers).length} respuestas).</span></div></details>`).join('')}</div>`:''}
 <form class="card stack" data-form="diagObs" data-id="${pt.id}"><h3>Observaciones de la mentora</h3><textarea id="obs" placeholder="Indicaciones generales que verá el participante al validar…">${esc(d.obs)}</textarea>
 <div class="row"><button class="btn btn-line" type="submit">Guardar observaciones</button>${d.status==='enviado'?`<button class="btn btn-lime" type="button" data-act="validateDiag" data-id="${pt.id}">${I('check')}Validar diagnóstico</button>`:''}${['enviado','validado'].includes(d.status)&&partActive(pt)?`<button class="btn btn-line" type="button" data-act="allowCorrection" data-id="${pt.id}">Autorizar corrección</button>`:''}</div></form>
 ${d.status==='validado'?`<div class="card-dark row between"><div class="stack-s"><h3>${pt.routeApproved?'Ruta aprobada':'Siguiente paso: diseñar la ruta'}</h3><p style="color:var(--on-dark-muted)" class="small">${pt.routeApproved?'Puedes modificar actividades, fechas y etapas.':'Selecciona actividades por etapa y aprueba la ruta.'}</p></div><button class="btn btn-lime" data-go="a-route" data-id="${pt.id}">${pt.routeApproved?'Editar ruta':'Diseñar ruta'} ${I('arrow')}</button></div>`:''}
 </div>`};

V['a-route']=()=>{const pt=part(UI.params.id);if(!pt)return empty('No encontrado');const p=person(pt.pid);const dv=pt.diag.initial.status==='validado';
 return `<div class="stack-l"><button class="link small" data-go="a-track" data-id="${pt.id}" style="align-self:flex-start">← Seguimiento de ${esc(p.nombre)}</button>
 ${aHead('Ruta de '+esc(fullName(p)),esc(prog(pt.programId).name)+(pt.diag.initial.scores?' · prioridades del diagnóstico: '+names(analyze(pt.diag.initial.scores).prio):''),pt.routeApproved?pill('Ruta aprobada','st-apr'):pill('Ruta en diseño','st-rev'))}
 ${!pt.routeApproved?`<div class="notice n-soft">${I('route')}<span class="small">Arma la ruta y apruébala. Al aprobar, solo se habilita la etapa Convertir; las demás las abres cuando quieras.</span></div>`:''}
 ${DIMS.map(d=>{const as=pt.assignments.filter(a=>a.stage===d.k);const avail=S.library.filter(l=>l.active&&l.dim===d.k&&!as.some(a=>a.libId===l.id&&a.active));
  return `<div class="card stack"><div class="row between"><div class="row">${dimBadge(d.k)}<h3>${d.name}</h3></div>${pt.routeApproved?`<div class="row">${pt.stages[d.k]?pill('Habilitada','st-ok'):pill('Bloqueada','st-lock')}<button class="btn btn-line btn-sm" data-act="toggleStage" data-id="${pt.id}" data-k="${d.k}">${pt.stages[d.k]?'Bloquear':'Habilitar etapa'}</button></div>`:''}</div>
  ${as.length?`<div class="tbl-wrap"><table><thead><tr><th>Actividad</th><th>Tipo</th><th>Entrega</th><th>Estado</th><th></th></tr></thead><tbody>${as.map(a=>`<tr style="${a.active?'':'opacity:.55'}"><td><b>${esc(a.name)}</b><div class="tiny muted">v${a.ver}${a.active?'':' · retirada'}</div></td>
   <td><select data-change="mand" data-id="${pt.id}" data-aid="${a.id}" ${a.active?'':'disabled'} style="min-height:36px;padding:6px 10px;font-size:13px;width:auto"><option value="1" ${a.mandatory?'selected':''}>Obligatoria</option><option value="0" ${a.mandatory?'':'selected'}>Complementaria</option></select></td>
   <td><input type="date" value="${a.due||''}" data-change="due" data-id="${pt.id}" data-aid="${a.id}" ${a.active&&dStatus(a)!=='aprobado'?'':'disabled'} style="min-height:36px;padding:6px 10px;font-size:13px;width:auto"></td>
   <td>${stPill(a)}</td><td>${a.active?`<button class="btn btn-line btn-sm" data-act="retire" data-id="${pt.id}" data-aid="${a.id}">Retirar</button>`:`<button class="btn btn-dark btn-sm" data-act="restore" data-id="${pt.id}" data-aid="${a.id}">Recuperar</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Sin actividades.</p>'}
  ${avail.length?`<div class="row"><select id="add-${d.k}" style="flex:1;min-width:200px">${avail.map(l=>`<option value="${l.id}">${esc(l.name)} (v${l.version})</option>`).join('')}</select><select id="addm-${d.k}" style="width:auto"><option value="1">Obligatoria</option><option value="0">Complementaria</option></select><button class="btn btn-dark btn-sm" data-act="addAct" data-id="${pt.id}" data-k="${d.k}">${I('plus')}Agregar</button></div>`:''}</div>`}).join('')}
 ${!pt.routeApproved?`<div class="card-dark row between"><div class="stack-s"><h3>Aprobar ruta</h3><p class="small" style="color:var(--on-dark-muted)">${dv?'Se habilitará la etapa Convertir y el participante recibirá un aviso en su panel.':'Primero valida el diagnóstico de esta persona.'}</p></div><button class="btn btn-lime" data-act="approveRoute" data-id="${pt.id}" ${dv&&pt.assignments.some(a=>a.active)?'':'disabled'}>${I('check')}Aprobar ruta</button></div>`:''}
 <div class="card stack-s"><h3>Historial administrativo</h3><p class="tiny muted">Solo visible para ti.</p>${pt.history.length?`<div class="tbl-wrap"><table><thead><tr><th>Fecha</th><th>Cambio</th><th>Antes</th><th>Después</th><th>Autor</th></tr></thead><tbody>${pt.history.map(h=>`<tr><td class="small">${fd(h.date)}</td><td class="small"><b>${esc(h.change)}</b></td><td class="small muted">${esc(h.before)}</td><td class="small">${esc(h.after)}</td><td class="small">${esc(h.author)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Sin cambios registrados.</p>'}</div></div>`};

V['a-review']=()=>{const pt=part(UI.params.id);const a=pt&&pt.assignments.find(x=>x.id===UI.params.aid);if(!a)return empty('No encontrado');const p=person(pt.pid);
 const last=a.versions[a.versions.length-1];const pending=last&&!last.review;
 return `<div class="stack-l" style="max-width:860px"><button class="link small" data-go="a-reviews" style="align-self:flex-start">← Revisiones</button>
 ${aHead(esc(a.name),`${esc(fullName(p))} · ${DIM[a.stage].name} · ${a.mandatory?'Obligatoria':'Complementaria'}${a.due?' · entrega '+fd(a.due):''}`,stPill(a))}
 ${p.status==='suspendido'?`<div class="notice n-soft">${I('alert')}<span class="small">La cuenta está suspendida. Puedes revisar y aprobar; si pides ajustes, la persona no podrá hacerlos hasta que la reactives.</span></div>`:''}
 ${!partActive(pt)?`<div class="notice n-soft">${I('alert')}<span class="small">La mentoría finalizó. Si pides ajustes, deberás ampliar la fecha para que pueda editarlos.</span></div>`:''}

  ${a.fields.map((f,i)=>`<div class="stack-s"><span class="flabel">${i+1}. ${esc(f)}</span><div class="ans">${esc(last.answers[i]||'—')}</div><input type="text" id="cm-${i}" placeholder="Comentario sobre esta respuesta (opcional)"></div>`).join('')}</div>

V['a-track']=()=>{const pt=part(UI.params.id);if(!pt)return empty('No encontrado');const p=person(pt.pid);const pr=progress(pt);const ps=partsOf(p.id);const s=personState(p);
 const sameProgCoh=S.cohorts.filter(c=>c.programId===pt.programId);
 return `<div class="stack-l"><button class="link small" data-go="a-people" style="align-self:flex-start">← Participantes</button>
 ${aHead(esc(fullName(p)),`${esc(p.email)} · ${esc(p.profesion||'')} · ${esc(p.pais||'')}`,pill(s[0],s[1]))}
 ${ps.length>1?`<div class="row">${ps.map(x=>`<button class="btn btn-sm ${x.id===pt.id?'btn-dark':'btn-line'}" data-go="a-track" data-id="${x.id}">${esc(prog(x.programId).name)}${partActive(x)?'':' · finalizada'}</button>`).join('')}</div>`:''}
 <div class="kpis"><div class="kpi"><span>Progreso oficial</span><b class="num">${pr.pct===null?'—':pr.pct+'%'}</b><span>${pr.pct===null?'Pendiente de iniciar':pr.appr+' de '+pr.mand+' obligatorias aprobadas'}</span></div><div class="kpi"><span>Trabajo presentado</span><b class="num">${pr.presented}/${pr.total}</b><span>Enviadas o aprobadas</span></div><div class="kpi"><span>En revisión · ajustes</span><b class="num">${pr.rev} · ${pr.aju}</b><span>Atrasadas: ${pr.late}</span></div><div class="kpi"><span>Participación</span><b style="font-size:18px">${partActive(pt)?'Activa':'Finalizada'}</b><span>${fd(pt.start)} – ${fd(pt.end)}</span></div></div>
 <div class="grid2">
  <div class="card stack"><h3>Diagnósticos</h3><div class="row between small"><span>Inicial (v${pt.diag.initial.version})</span>${pill(DIAG_ST[pt.diag.initial.status][0],DIAG_ST[pt.diag.initial.status][1])}</div><div class="row between small"><span>Final</span>${pill(finalLabel(pt)[0],finalLabel(pt)[1])}</div>
   <div class="row">${pt.diag.initial.status!=='no_iniciado'?`<button class="btn btn-line btn-sm" data-go="a-review-diag" data-id="${pt.id}">Ver diagnóstico inicial</button>`:''}${!pt.diag.final.enabled&&partActive(pt)&&pt.diag.initial.status==='validado'?`<button class="btn btn-dark btn-sm" data-act="enableFinal" data-id="${pt.id}">Habilitar diagnóstico final</button>`:''}</div>
   ${pt.diag.final.status==='enviado'?`<div class="small">${DIMS.map(d=>`${d.name}: ${pt.diag.initial.scores[d.k]} → <b>${pt.diag.final.scores[d.k]}</b>`).join(' · ')}</div>`:''}</div>
  <div class="card stack"><h3>Fechas y cohorte</h3><form class="row" data-form="extend" data-id="${pt.id}" style="align-items:flex-end"><div class="field" style="flex:1;min-width:160px"><label for="ex-end">Fecha de finalización</label><input id="ex-end" type="date" value="${pt.end}" required></div><button class="btn btn-dark btn-sm" type="submit">${partActive(pt)?'Cambiar fecha':'Ampliar mentoría'}</button></form>
   ${sameProgCoh.length?`<div class="row" style="align-items:flex-end"><div class="field" style="flex:1;min-width:160px"><label for="tr-c">Cohorte</label><select id="tr-c">${sameProgCoh.map(c=>`<option value="${c.id}" ${c.id===pt.cohortId?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><button class="btn btn-line btn-sm" data-act="transfer" data-id="${pt.id}">Transferir</button></div>`:''}
   <p class="tiny muted">Ampliar restaura la edición; las versiones aprobadas siguen protegidas. Transferir conserva todo el avance.</p></div>
 </div>
 <div class="card stack"><div class="row between"><h3>Ruta y actividades</h3><button class="btn btn-dark btn-sm" data-go="a-route" data-id="${pt.id}">${I('route')}${pt.routeApproved?'Editar ruta':'Diseñar ruta'}</button></div>
  <div class="row small">${DIMS.map(d=>`<span class="row" style="gap:6px">${dimBadge(d.k,24)}${pt.stages[d.k]?'Habilitada':'Bloqueada'}</span>`).join('')}</div>
  ${pt.assignments.length?`<div class="tbl-wrap"><table><thead><tr><th>Actividad</th><th>Tipo</th><th>Entrega</th><th>Estado</th><th></th></tr></thead><tbody>${pt.assignments.map(a=>`<tr style="${a.active?'':'opacity:.55'}"><td><div class="row" style="gap:8px;flex-wrap:nowrap">${dimBadge(a.stage,24)}<b>${esc(a.name)}</b></div>${a.active?'':'<span class="tiny muted">Retirada</span>'}</td><td class="small">${a.mandatory?'Obligatoria':'Complementaria'}</td><td class="small">${fd(a.due)}</td><td>${stPill(a)}</td><td>${dStatus(a)==='revision'?`<button class="btn btn-dark btn-sm" data-go="a-review" data-id="${pt.id}" data-aid="${a.id}">Revisar</button>`:a.versions.length?`<button class="btn btn-line btn-sm" data-go="a-review" data-id="${pt.id}" data-aid="${a.id}">Historial</button>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">Sin actividades asignadas.</p>'}</div>
 <form class="card stack" data-form="notes" data-id="${pt.id}"><h3>Observaciones de mentoría</h3><textarea id="nt">${esc(pt.notes||'')}</textarea><div><button class="btn btn-line btn-sm" type="submit">Guardar</button></div></form>
 <div class="card stack-s"><h3>Historial de cambios</h3>${pt.history.length?pt.history.slice(0,8).map(h=>`<div class="row between small" style="border-bottom:1px solid var(--line);padding-block:8px"><span><b>${esc(h.change)}</b> · ${esc(h.before)} → ${esc(h.after)}</span><span class="muted">${fd(h.date)}</span></div>`).join(''):'<p class="small muted">Sin cambios.</p>'}</div>
 <form class="card stack" data-form="addPart" data-pid="${p.id}"><h3>Agregar a otro programa</h3><p class="small muted">Conserva la cuenta y crea una participación independiente.</p><div class="grid3"><div class="field"><label for="ap-p">Programa</label><select id="ap-p">${S.programs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label for="ap-s">Inicio</label><input id="ap-s" type="date" value="${todayISO()}"></div><div class="field"><label for="ap-d">Duración (días)</label><input id="ap-d" type="number" value="90" min="1"></div></div><div><button class="btn btn-line btn-sm" type="submit">${I('plus')}Crear participación</button></div></form>
 </div>`};

V['a-library']=()=>{const edit=UI.params.edit;
 const form=(l)=>`<form class="card stack" data-form="libSave" data-id="${l?l.id:''}" style="border-color:var(--ink)"><h3>${l?'Editar «'+esc(l.name)+'»':'Nueva actividad'}</h3>${l?`<div class="notice n-soft">${I('alert')}<span class="small">Guardar crea la versión ${l.version+1}. Las asignaciones existentes conservan su versión.</span></div>`:''}
 <div class="grid2"><div class="field"><label for="lb-n">Nombre</label><input id="lb-n" required value="${esc(l?.name||'')}"></div><div class="field"><label for="lb-d">Dimensión CODE</label><select id="lb-d">${DIMS.map(d=>`<option value="${d.k}" ${l?.dim===d.k?'selected':''}>${d.name}</option>`).join('')}</select></div></div>
 <div class="field"><label for="lb-p">Propósito</label><input id="lb-p" required value="${esc(l?.purpose||'')}"></div><div class="field"><label for="lb-i">Instrucciones</label><textarea id="lb-i" style="min-height:70px" required>${esc(l?.instructions||'')}</textarea></div>
 <div class="field"><label for="lb-f">Preguntas o campos (uno por línea)</label><textarea id="lb-f" required>${esc((l?.fields||[]).join('\n'))}</textarea></div>
 <div class="row"><button class="btn btn-dark" type="submit">Guardar</button><button class="btn btn-line" type="button" data-go="a-library">Cancelar</button></div></form>`;
 return `<div class="stack-l">${aHead('Biblioteca de actividades CODE','Editar no altera trabajos ya comenzados. Desactivar impide nuevas asignaciones sin borrar trabajos existentes.',`<button class="btn btn-lime" data-go="a-library" data-edit="new">${I('plus')}Nueva actividad</button>`)}
 ${edit==='new'?form(null):''}
 ${DIMS.map(d=>`<div class="stack-s"><div class="row">${dimBadge(d.k)}<h3>${d.name}</h3></div><div class="tbl-wrap"><table><thead><tr><th>Actividad</th><th>Versión</th><th>Asignada a</th><th>Estado</th><th></th></tr></thead><tbody>${S.library.filter(l=>l.dim===d.k).map(l=>{const n=S.participations.filter(pt=>pt.assignments.some(a=>a.libId===l.id)).length;return `<tr style="${l.active?'':'opacity:.6'}"><td><b>${esc(l.name)}</b><div class="tiny muted">${esc(l.purpose)}</div></td><td class="num small">v${l.version}</td><td class="small num">${n} participación(es)</td><td>${l.active?pill('Activa','st-ok'):pill('Inactiva','st-sin')}</td><td><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn btn-line btn-sm" data-go="a-library" data-edit="${l.id}">Editar</button><button class="btn btn-line btn-sm" data-act="toggleLib" data-id="${l.id}">${l.active?'Desactivar':'Activar'}</button></div></td></tr>${edit===l.id?`<tr><td colspan="5">${form(l)}</td></tr>`:''}`}).join('')}</tbody></table></div></div>`).join('')}
 <p class="tiny muted">Contenido metodológico de ejemplo, pendiente de aprobación editorial de Tiby (PRD 5.12).</p></div>`};

V['a-diags']=()=>{const t=UI.params.t==='priv'?'priv':'pub';const vers=t==='pub'?S.pubVersions:S.privVersions;const cur=t==='pub'?S.pubCurrent:S.privCurrent;const draft=vers.find(v=>v.status==='borrador');
 return `<div class="stack-l">${aHead('Cuestionarios','Las ediciones se guardan como borrador. Solo una publicación manual crea una versión vigente.')}
 <div class="card row between"><div class="stack-s"><h3>Diagnóstico público</h3><p class="small muted">${S.publicActive?'Se pueden iniciar diagnósticos nuevos.':'En pausa: no se inician intentos nuevos; los iniciados pueden terminarse en su plazo de 7 días y los resultados siguen disponibles 30 días.'}</p></div><button class="btn ${S.publicActive?'btn-line':'btn-lime'}" data-act="togglePublic">${S.publicActive?'Pausar diagnóstico público':'Activar diagnóstico público'}</button></div>
 <div class="row"><button class="btn btn-sm ${t==='pub'?'btn-dark':'btn-line'}" data-go="a-diags" data-t="pub">Público (12 preguntas)</button><button class="btn btn-sm ${t==='priv'?'btn-dark':'btn-line'}" data-go="a-diags" data-t="priv">Privado (mentoría)</button></div>
 <div class="tbl-wrap"><table><thead><tr><th>Versión</th><th>Estado</th><th>Publicada</th><th>Preguntas</th><th>Uso</th></tr></thead><tbody>${[...vers].reverse().map(v=>{const used=t==='pub'?S.attempts.filter(a=>a.v===v.v).length+' intentos':S.participations.filter(p=>p.diag.initial.version===v.v&&p.diag.initial.status!=='no_iniciado').length+' diagnósticos';return `<tr><td><b>v${v.v}</b></td><td>${v.status==='borrador'?pill('Borrador','st-bor'):v.v===cur?pill('Vigente','st-apr'):pill('Anterior','st-sin')}</td><td class="small">${fd(v.publishedAt)}</td><td class="num small">${v.questions.length}</td><td class="small">${used}</td></tr>`}).join('')}</tbody></table></div>
 ${draft?`<form class="card stack" data-form="draftSave" data-t="${t}"><div class="row between"><h3>Borrador v${draft.v}</h3>${pill('No publicado','st-bor')}</div>
  ${draft.questions.map((q,i)=>`<div class="stack-s" style="padding-block:6px;border-bottom:1px solid var(--line)"><div class="row" style="gap:8px">${dimBadge(q.dim,24)}<span class="tiny muted">${q.type==='text'?'Respuesta abierta':t==='pub'?'4 opciones · puntaje 0 a 3':'Escala 1 a 5'}</span></div><input type="text" id="dq-${i}" value="${esc(q.text)}" aria-label="Pregunta ${i+1}">${q.opts?`<div class="grid2">${q.opts.map((o,j)=>`<input type="text" id="do-${i}-${j}" value="${esc(o)}" aria-label="Opción ${j+1} (${j} puntos)" style="font-size:13.5px;min-height:38px;padding:7px 11px">`).join('')}</div>`:''}</div>`).join('')}
  <div class="row"><button class="btn btn-line" type="submit">Guardar borrador</button></div>
  <div class="card-soft stack-s"><label class="check"><input type="checkbox" id="pub-ok">Revisé preguntas, opciones y puntuaciones. Publicar no modifica evaluaciones anteriores ni en curso.</label><div><button class="btn btn-dark" type="button" data-act="publishDraft" data-t="${t}">Publicar v${draft.v}</button></div>${UI.err?`<p class="err">${esc(UI.err)}</p>`:''}</div></form>`
 :`<div><button class="btn btn-dark" data-act="newDraft" data-t="${t}">${I('plus')}Crear borrador desde la versión vigente</button></div>`}
 <p class="tiny muted">Preguntas, puntuaciones y recomendaciones de esta demo son de ejemplo y requieren aprobación de Tiby antes de usarse con personas reales.</p></div>`};

V['a-stats']=()=>{const vf=UI.params.v||String(S.pubCurrent);const all=vf==='all';
 const at=S.attempts.filter(a=>all||a.v===+vf);const comp=at.filter(a=>a.status==='completado');const clicks=at.reduce((s,a)=>s+(a.waClicks||0),0);
 const rate=at.length?Math.round(comp.length/at.length*100):0;
 const avg={};DIMS.forEach(d=>{avg[d.k]=comp.length?Math.round(comp.reduce((s,a)=>s+a.scores[d.k],0)/comp.length):0});
 const pc={};DIMS.forEach(d=>pc[d.k]=comp.filter(a=>a.prio.includes(d.k)).length);const maxP=Math.max(1,...Object.values(pc));
 // tendencia: últimas 8 semanas
 const weeks=[];const end=new Date();for(let w=7;w>=0;w--){const to=new Date(end.getTime()-w*7*864e5),from=new Date(to.getTime()-7*864e5);const inW=at.filter(a=>{const t=new Date(a.start);return t>from&&t<=to});weeks.push({lab:fd(isoOf(from)).replace(/ \d{4}$/,''),st:inW.length,cp:inW.filter(a=>a.status==='completado').length})}
 const mx=Math.max(1,...weeks.map(w=>w.st));
 return `<div class="stack-l">${aHead('Estadísticas del diagnóstico público','Datos anónimos y agregados. Se cuentan intentos, no personas.',`<select data-change="statsV" style="width:auto"><option value="all" ${all?'selected':''}>Todas las versiones (solo volúmenes)</option>${S.pubVersions.filter(v=>v.status!=='borrador').map(v=>`<option value="${v.v}" ${vf==String(v.v)?'selected':''}>Versión ${v.v}${v.v===S.pubCurrent?' (vigente)':''}</option>`).join('')}</select>`)}
 <div class="kpis"><div class="kpi"><b class="num">${at.length}</b><span>Intentos iniciados</span></div><div class="kpi"><b class="num">${comp.length}</b><span>Diagnósticos completados</span></div><div class="kpi"><b class="num">${rate}%</b><span>Tasa de finalización</span></div><div class="kpi"><b class="num">${clicks}</b><span>Clics en WhatsApp</span></div></div>
 <div class="notice n-soft">${I('alert')}<span class="small">Un clic en WhatsApp indica que se abrió la aplicación; no confirma una conversación ni una venta. Una misma persona puede hacer varios intentos.</span></div>
 <div class="card stack"><div class="row between"><h3>Tendencia semanal</h3><div class="legend"><span><i style="background:var(--soft2)"></i>Iniciados</span><span><i style="background:var(--ink)"></i>Completados</span></div></div>
  <div style="overflow-x:auto"><div class="cols" style="min-width:420px">${weeks.map(w=>`<div class="c"><span class="val num">${w.cp}/${w.st}</span><div class="stk"><div class="s1" style="height:${w.st/mx*100}%"></div><div class="s2" style="height:${w.cp/mx*100}%"></div></div><span class="lab">${w.lab}</span></div>`).join('')}</div></div></div>
 ${all?`<div class="notice n-amber">${I('alert')}<span class="small">Las puntuaciones por dimensión se muestran por versión, porque versiones distintas pueden no ser comparables. Elige una versión para verlas.</span></div>`:
 `<div class="grid2"><div class="card stack"><h3>Promedio por dimensión</h3>${dimBars(avg)}</div>
 <div class="card stack"><h3>Dimensiones prioritarias más frecuentes</h3><p class="tiny muted">Un intento con empate cuenta en cada dimensión empatada.</p>${[...DIMS].sort((a,b)=>pc[b.k]-pc[a.k]).map(d=>`<div class="dimrow">${dimBadge(d.k)}<span style="font-weight:600">${d.name}</span><div class="bar"><span style="width:${pc[d.k]/maxP*100}%;background:var(--orange)"></span></div><b class="num" style="text-align:right">${pc[d.k]}</b></div>`).join('')}</div></div>`}
 <p class="tiny muted">Incluye intentos de ejemplo generados para la demo. No se muestran fichas personales.</p></div>`};

V['a-site']=()=>{const s=S.site;const f=(id,l)=>`<div class="field"><label for="st-${id}">${l}</label><input id="st-${id}" name="${id}" value="${esc(s[id])}"></div>`;const t=(id,l)=>`<div class="field"><label for="st-${id}">${l}</label><textarea id="st-${id}" name="${id}" style="min-height:80px">${esc(s[id])}</textarea></div>`;
 return `<div class="stack-l" style="max-width:860px">${aHead('Editor del sitio público','Última actualización: '+fd(s.updatedAt),`<button class="btn btn-line" data-act="previewSite">${I('eye')}Ver sitio</button>`)}
 <form class="stack-l" data-form="site">
 <div class="card stack"><h3>Portada</h3>${f('heroTitle','Titular')}${f('heroHighlight','Parte destacada del titular (verde lima)')}${t('heroText','Texto de apoyo')}<div class="grid2">${f('ctaPrimary','Botón principal')}${f('ctaSecondary','Botón de participantes')}</div></div>
 <div class="card stack"><h3>Presentación de Tiby</h3>${f('bioTitle','Título')}${t('bio','Presentación breve')}
  <div class="field"><label for="st-photo">Fotografía</label><div class="row">${s.photo?`<img src="${s.photo}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:12px">`:'<span class="small muted">Sin imagen: se muestra el monograma TH.</span>'}<input id="st-photo" type="file" accept="image/*" style="max-width:260px">${s.photo?'<button class="btn btn-line btn-sm" type="button" data-act="rmPhoto">Quitar</button>':''}</div></div></div>
 <div class="card stack"><h3>Diagnóstico y CODE</h3>${f('diagTitle','Titular de la explicación del diagnóstico')}${DIMS.map(d=>`<div class="field"><label for="st-dim-${d.k}">${d.k} · ${d.name}</label><textarea id="st-dim-${d.k}" style="min-height:60px">${esc(s.dims[d.k])}</textarea></div>`).join('')}</div>
 <div class="card stack"><h3>WhatsApp</h3><div class="field"><label for="st-whatsapp">Número de destino (con código de país, sin +)</label><input id="st-whatsapp" name="whatsapp" inputmode="numeric" pattern="[0-9]{8,15}" value="${esc(s.whatsapp)}"></div><p class="small muted">El mensaje sugerido se adapta a las dimensiones prioritarias de cada resultado.</p></div>
 <div class="savebar" style="bottom:0"><button class="btn btn-lime" type="submit">Guardar cambios</button></div></form></div>`};

V['a-deletions']=()=>`<div class="stack-l">${aHead('Solicitudes de eliminación','Ninguna eliminación irreversible se ejecuta sin verificación y confirmación final.')}
 ${S.deletions.length?S.deletions.map(r=>{const p=person(r.pid);return `<form class="card stack" data-form="delStep" data-id="${r.id}"><div class="row between"><div class="stack-s"><h3>${esc(r.name)}</h3><span class="small muted">${esc(r.email)} · recibida ${fd(r.date)}</span></div>${pill(r.status,r.status==='Cerrada'?'st-sin':'st-rev')}</div>
 ${r.why?`<p class="small">Motivo: «${esc(r.why)}»</p>`:''}
 ${r.status==='Cerrada'?`<p class="small"><b>Decisión:</b> ${esc(r.decision)} · ${fd(r.closedAt)}${r.retain?' · Conservado por obligación legal: '+esc(r.retain):''}</p>`:`
 <label class="check"><input type="checkbox" id="dv-${r.id}" ${r.verified?'checked':''}>Identidad verificada</label>

function go(view,params={}){const p={...params};delete p.go;delete p.act;UI.view=view;UI.params=p;UI.err='';UI.flash=null;saveUI();render();window.scrollTo(0,0)}

 sendDiag(el){const pt=curPart();const kind=el.dataset.kind;const dg=pt.diag[kind];const ver=privVersion(kind==='final'?pt.diag.initial.version:dg.version);

  const s=document.getElementById('savestate');if(s)s.textContent='Guardando…';clearTimeout(autoT);autoT=setTimeout(()=>{a.draft.savedAt=nowTs();save();flashSave()},600)}
 if(el.dataset.bind==='diag'){const pt=curPart();const dg=pt.diag[el.dataset.kind];dg.answers[el.dataset.q]=el.value;if(dg.status==='no_iniciado'){dg.status='en_progreso';dg.startedAt=nowTs()}
  const c=document.getElementById('cnt-'+el.dataset.q);if(c)c.textContent=el.value.length+'/500';const s=document.getElementById('savestate');if(s)s.textContent='Guardando…';clearTimeout(autoT);autoT=setTimeout(()=>{save();flashSave()},600)}
});
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset.change;if(!k)return;
 if(k==='part'){UI.partId=el.value;saveUI();go(UI.view==='p-activity'?'p-home':UI.view,UI.view==='p-portfolio'?UI.params:{})}
 if(k==='statsV'){go('a-stats',{v:el.value})}
 if(k==='mand'){const pt=part(el.dataset.id),a=pt.assignments.find(x=>x.id===el.dataset.aid);const m=el.value==='1';if(m===a.mandatory)return;a.mandatory=m;logChange(pt,'Clasificación · '+a.name,m?'Complementaria':'Obligatoria',m?'Obligatoria':'Complementaria',pt.routeApproved?`«${a.name}» ahora es ${m?'obligatoria':'complementaria'}.`:null);save();render()}
 if(k==='due'){const pt=part(el.dataset.id),a=pt.assignments.find(x=>x.id===el.dataset.aid);const before=a.due;a.due=el.value||null;logChange(pt,'Fecha de entrega · '+a.name,fd(before),fd(a.due),pt.routeApproved?`La fecha de entrega de «${a.name}» ${a.due?'es ahora el '+fd(a.due):'se retiró'}.`:null);save();render()}
});

/* ============================== RENDER ============================== */
function renderDemo(){const r=UI.role;document.getElementById('demo').innerHTML=`<div class="demobar"><div class="wrap"><b>DEMO</b><span>Ver como:</span>
 <button class="${r==='public'?'on':''}" data-act="demoRole" data-r="public">Visitante</button><button class="${r==='participant'?'on':''}" data-act="demoRole" data-r="participant">María · participante</button><button class="${r==='admin'?'on':''}" data-act="demoRole" data-r="admin">Tiby · mentora</button><span class="sp"></span><button data-act="demoReset">${UI.confirmReset?'¿Seguro? Toca otra vez':'Reiniciar demo'}</button></div></div>`}
function render(){
 renderDemo();let v=UI.view;const app=document.getElementById('app');
 if(v.startsWith('p-')){const u=me();if(UI.role!=='participant'||!u||u.status!=='activo'){UI.role='public';UI.uid=null;UI.view=v='login'}}
 if(v.startsWith('a-')&&UI.role!=='admin'){UI.view=v='login'}
 const fn=V[v]||V.home;
 if(v.startsWith('p-')){if(!curPart()){app.innerHTML=empty('No tienes mentorías asignadas');return}app.innerHTML=pShell(fn())}
 else if(v.startsWith('a-'))app.innerHTML=aShell(fn());
 else app.innerHTML=fn();
 document.title='Mi Expansión';
}
render();
</script>
